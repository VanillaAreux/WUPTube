# WUP Tube Music: YouTube Music audio on the GamePad, on its own (Wi-Fi + HTTPS, no PC or Wii U)
name = WUP Tube Music
author = you
version = 0.1
description = Search and play YouTube Music
kit = yes
net = yes
https = yes
text_in_big = bearssl
large = yes
deps = helix-aac
prebuild = patch_helix.py
cflags = -Wno-implicit-function-declaration -Wno-undef-true
include = ../../third_party/helix-aac/src
    ../../third_party/helix-aac/src/libhelix-aac
    src/helix-config
sources = src
    ../../third_party/helix-aac/src/libhelix-aac/*.c
